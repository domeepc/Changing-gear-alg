name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: "3.21.2"

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make
          ls -la  # Show what was built

      - name: Create Release
        run: |
          echo "GITHUB_REF: $GITHUB_REF"
          echo "Current directory: $(pwd)"
          echo "Build directory contents:"
          ls -la build/ || echo "Build directory not found"

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Creating release for tag: $TAG_NAME"
            
            # Check if the binary exists
            if [ -f "build/changing_gear_alg" ]; then
              echo "Found binary: build/changing_gear_alg"
              gh release create "$TAG_NAME" \
                --title "Release $TAG_NAME" \
                --notes "Release of version $TAG_NAME. Includes compiled binary for Linux x64." \
                build/changing_gear_alg src/script.cpp
            else
              echo "Binary not found, creating release with source only"
              gh release create "$TAG_NAME" \
                --title "Release $TAG_NAME" \
                --notes "Release of version $TAG_NAME" \
                src/script.cpp
            fi
          else
            echo "Not a tag push, skipping release creation"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
